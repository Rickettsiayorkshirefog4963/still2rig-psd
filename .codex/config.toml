# Project-scoped MCP configuration. Trust this project before Codex loads it.
# The wrapper stores its connection token and auto-selected local port only
# under the ignored .still2rig-psd/ directory and does not open a browser.
[mcp_servers.colab-mcp]
command = "bash"
args = ["scripts/start-colab-mcp.sh"]
startup_timeout_sec = 15
tool_timeout_sec = 3660
default_tools_approval_mode = "prompt"
enabled = true
required = false
